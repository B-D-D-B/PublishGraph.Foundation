name: Deploy SDA website
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Reviewed target environment
        required: true
        type: choice
        options: [dev, test, prod]
permissions:
  contents: read
  id-token: write
concurrency:
  group: sda-website-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: sda-website-${{ inputs.environment }}
    env:
      SDA_ENVIRONMENT: ${{ inputs.environment }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SDA_APP_NAME: ${{ vars.SDA_APP_NAME }}
      SDA_RESOURCE_GROUP: ${{ vars.SDA_RESOURCE_GROUP }}
      SDA_APP_ID: ${{ vars.SDA_APP_ID }}
      SDA_PLAN_ID: ${{ vars.SDA_PLAN_ID }}
      SDA_PRINCIPAL_ID: ${{ vars.SDA_PRINCIPAL_ID }}
      SDA_DEPLOY_ROLE_ID: ${{ vars.SDA_DEPLOY_ROLE_ID }}
      SDA_HOSTING_PACKET_SHA256: ${{ vars.SDA_HOSTING_PACKET_SHA256 }}
      SDA_HOSTING_PACKET_BASE64: ${{ vars.SDA_HOSTING_PACKET_BASE64 }}
      SDA_AUTH_DISPOSITION_SHA256: ${{ vars.SDA_AUTH_DISPOSITION_SHA256 }}
      SDA_AUTH_READY: ${{ vars.SDA_AUTH_READY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.404
      - name: Refuse incomplete release authorization
        run: node Static/SDA-WebApp/tools/release-target.cjs --preflight
      - name: Build and verify accepted package
        run: |
          node Static/SDA-WebApp/tools/bind-content.cjs --output release/content.json
          dotnet build Static/SDA-WebApp/SDA.Website.csproj -c Release --nologo
          node Static/SDA-WebApp/tools/check-host.cjs --run release/local
          node Static/SDA-WebApp/tools/check-workflow.cjs --output release/workflow.json
          node Static/SDA-WebApp/tools/check-release-target.cjs --output release/release-guard.json
          node Static/SDA-WebApp/tools/package.cjs --output release/package/website.zip --receipt release/package/package.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sda-website-${{ inputs.environment }}-${{ github.sha }}
          path: |
            release/content.json
            release/local/result.json
            release/workflow.json
            release/release-guard.json
            release/package/package.json
            release/package/website.zip
          if-no-files-found: error
          retention-days: 30
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify exact app, plan, settings and deployment role
        run: node Static/SDA-WebApp/tools/release-target.cjs --verify
      - name: Deploy only the reviewed website ZIP
        shell: bash
        run: >-
          az webapp deploy --subscription "$AZURE_SUBSCRIPTION_ID"
          --resource-group "$SDA_RESOURCE_GROUP" --name "$SDA_APP_NAME"
          --type zip --src-path release/package/website.zip --clean true --restart true
