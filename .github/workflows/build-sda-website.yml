name: Build SDA website artifact

on:
  push:
    branches: [main, agents/sda-website-migration-setup]
    paths:
      - .github/workflows/build-sda-website.yml
      - Static/SDA-WebApp/**
      - Static/SDA-Standalone/**
      - .gitattributes
      - .gitignore
      - global.json
      - Directory.Build.props
      - Directory.Packages.props
      - NuGet.Config

permissions:
  contents: read

concurrency:
  group: sda-website-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Refuse unexpected context
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = B-D-D-B/PublishGraph.Foundation
          test "$EVENT" = push
          case "$REF" in refs/heads/main|refs/heads/agents/sda-website-migration-setup) ;; *) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.9.0'
          check-latest: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/sda-dotnet-10.0.404
          DOTNET_ROOT: ${{ runner.temp }}/sda-dotnet-10.0.404
        with:
          dotnet-version: '10.0.404'
      - name: Capture actual clean source and toolchain
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/sda-dotnet-10.0.404
          DOTNET_ROOT: ${{ runner.temp }}/sda-dotnet-10.0.404
        run: node Static/SDA-WebApp/tools/producer.cjs --mode prepare --output artifacts/SDA-WEBAPP-PRODUCER-01/prepare.json
      - name: Package unchanged accepted website
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/sda-dotnet-10.0.404
          DOTNET_ROOT: ${{ runner.temp }}/sda-dotnet-10.0.404
        run: node Static/SDA-WebApp/tools/package.cjs --output artifacts/SDA-WEBAPP-PRODUCER-01/payload/website.zip --receipt artifacts/SDA-WEBAPP-PRODUCER-01/payload/package.json
      - name: Verify actual ZIP and post-build source
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/sda-dotnet-10.0.404
          DOTNET_ROOT: ${{ runner.temp }}/sda-dotnet-10.0.404
        run: node Static/SDA-WebApp/tools/producer.cjs --mode verify-build --input artifacts/SDA-WEBAPP-PRODUCER-01/prepare.json --payload artifacts/SDA-WEBAPP-PRODUCER-01/payload --output artifacts/SDA-WEBAPP-PRODUCER-01/verified.json
      - name: Upload exact two-file candidate bundle
        id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sda-website-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/SDA-WEBAPP-PRODUCER-01/payload/website.zip
            artifacts/SDA-WEBAPP-PRODUCER-01/payload/package.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Record native upload facts separately
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/sda-dotnet-10.0.404
          DOTNET_ROOT: ${{ runner.temp }}/sda-dotnet-10.0.404
          SDA_UPLOAD_ID: ${{ steps.bundle.outputs.artifact-id }}
          SDA_UPLOAD_DIGEST: ${{ steps.bundle.outputs.artifact-digest }}
        run: node Static/SDA-WebApp/tools/producer.cjs --mode record-upload --input artifacts/SDA-WEBAPP-PRODUCER-01/verified.json --output artifacts/SDA-WEBAPP-PRODUCER-01/evidence/producer-evidence.json
      - name: Upload supplementary evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sda-website-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-evidence
          path: artifacts/SDA-WEBAPP-PRODUCER-01/evidence/producer-evidence.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
